<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publicidad - Parada</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <video id="ad" preload="auto" autoplay playsinline></video>

  <script type="module">
    import { VIDEO_URL, T0 } from "../shared/config.js";
    import { initSync } from "../shared/sync.js";

    const video = document.getElementById("ad");
    video.src = VIDEO_URL;

    // Vertical (grabado con teléfono) → barras negras a los lados.
    // Horizontal → llena toda la pantalla.
    video.addEventListener("loadedmetadata", () => {
      const portrait = video.videoHeight > video.videoWidth;
      video.style.objectFit = portrait ? "contain" : "cover";
    });

    initSync(video, T0);

    // Fallback: si el navegador bloquea el autoplay con sonido,
    // muestra un cartel y arranca con un clic. En la TV en modo
    // kiosko (con flag) arranca solo y nunca aparece el cartel.
    const overlay = document.createElement("div");
    overlay.style.cssText =
      "position:fixed;inset:0;background:rgba(0,0,0,0.75);color:#fff;" +
      "display:flex;align-items:center;justify-content:center;" +
      "font-family:system-ui,sans-serif;font-size:24px;cursor:pointer;z-index:9999;";
    overlay.textContent = "▶ Toca para reproducir con sonido";
    overlay.addEventListener("click", () => {
      video.play().catch(() => {});
      overlay.remove();
    });
    document.body.appendChild(overlay);
    video.play().then(() => overlay.remove()).catch(() => {});
  </script>
</body>
</html>

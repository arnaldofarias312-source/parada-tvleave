<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publicidad</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <video id="ad" preload="auto" muted autoplay loop playsinline></video>

  <script type="module">
    import { VIDEO_URL } from "../shared/config.js";

    const video = document.getElementById("ad");
    video.src = VIDEO_URL;

    // Vertical (grabado con teléfono) → barras negras a los lados.
    // Horizontal → llena toda la pantalla.
    video.addEventListener("loadedmetadata", () => {
      const portrait = video.videoHeight > video.videoWidth;
      video.style.objectFit = portrait ? "contain" : "cover";
    });

    const startPlayback = () => {
      if (video.paused) {
        video.play().catch(() => {});
      }
    };
    startPlayback();
    video.addEventListener("canplay", startPlayback);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) startPlayback();
    });
  </script>

  <!-- Registro del Service Worker para funcionamiento offline -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Televisor 1 - Panel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "izq  top-der  top-der"
        "izq  video    bot-der";
      width: 100vw;
      height: 100vh;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #666;
      font-size: 2vw;
      letter-spacing: 0.05em;
    }

    .cell-izq {
      grid-area: izq;
      padding: 0;
      margin: 0;
      border: none;
    }

    .cell-top-der {
      grid-area: top-der;
      border: 1px solid #222;
    }

    .cell-video {
      grid-area: video;
      padding: 0;
      margin: 0;
      border: none;
      background: #000;
      transform: translateZ(0);
      will-change: transform;
    }

    .cell-slide {
      grid-area: bot-der;
      padding: 0;
      margin: 0;
      border: none;
    }

    .cell-izq iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transform: translateZ(0);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: translateZ(0);
      will-change: transform;
    }

    #streamFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: #000;
      display: none;
      z-index: 9999;
    }
  </style>
</head>

<body>
  <div class="grid">
    <div class="cell cell-izq">
      <iframe src="https://mapahospital-ida.vercel.app/" title="BusTrack Realtime" allowfullscreen></iframe>
    </div>
    <div class="cell cell-top-der">
  <iframe
    src="https://localhost:8889/camara"
    style="width:100%; height:100%; border:none; display:block;"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>
</div>
    <div class="cell cell-video">
      <video id="ad" preload="auto" muted autoplay loop playsinline></video>
    </div>
    <div class="cell cell-slide">
      <div id="rutas-slide" style="width: 100%; height: 100%;"></div>
    </div>
  </div>

  <iframe
    id="streamFrame"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
  </iframe>

  <!-- Capa invisible para capturar el primer toque en toda la pantalla y desbloquear el audio -->
  <div id="audio-unlocker" style="position: fixed; inset: 0; z-index: 99998; background: transparent; cursor: pointer;"></div>

  <audio id="bg-audio" preload="auto" loop src="https://sfwlrpwamioiazmqfpmp.supabase.co/storage/v1/object/public/media-parada/fondo.mp3?v=2"></audio>

  <script type="module">
    import { VIDEO_URL_PANEL, AUDIO_URL_FONDO } from "../shared/config.js";
    import { initRoutesSlideshow } from "../shared/routes-slideshow.js";
    import { listenControlCommands, CONTROL_ACTIONS } from "../shared/controller-sync.js";

    const video = document.getElementById("ad");
    const audio = document.getElementById("bg-audio");

    const radioPlayer = new Audio();
    radioPlayer.crossOrigin = "anonymous";
    radioPlayer.preload = "auto";

    // Modos posibles en el TV1:
    //   "normal"  → audio fondo + video panel
    //   "radio"   → solo radio
    //   "muteado" → TV2 tiene stream activo, aquí no suena nada
    let modoActual = "normal";

    // ─── VIDEO PANEL ─────────────────────────────────────────────────
    video.src = VIDEO_URL_PANEL;
    video.style.objectFit = "cover";

    function startVideoPanel() {
      if (video.paused) video.play().catch(() => {});
    }
    startVideoPanel();
    video.addEventListener("canplay", startVideoPanel);

    // ─── AUDIO DE FONDO ──────────────────────────────────────────────
    function asignarAudioFondo() {
      if (!audio.src || audio.src === "" || audio.src === window.location.href) {
        audio.src = AUDIO_URL_FONDO;
      }
    }

    function iniciarAudioFondo() {
      if (modoActual !== "normal") return;
      asignarAudioFondo();
      audio.muted = false;
      audio.volume = 1;
      if (audio.paused) audio.play().catch(() => {});
    }

    function detenerAudioFondo() {
      try {
        audio.pause();
        audio.currentTime = 0;
        audio.muted = true;
        audio.volume = 0;
        audio.removeAttribute("src");
        audio.load();
      } catch (e) {
        console.warn("Error al detener audio de fondo:", e);
      }
    }

    iniciarAudioFondo();

    audio.addEventListener("canplay", () => {
      if (modoActual === "normal" && audio.paused) {
        audio.play().catch(() => {});
      }
    });

    // ─── HELPERS ─────────────────────────────────────────────────────
    function detenerRadioTotal() {
      try {
        radioPlayer.pause();
        radioPlayer.currentTime = 0;
        radioPlayer.removeAttribute("src");
        radioPlayer.load();
      } catch (e) {
        console.warn("Error al detener radio:", e);
      }
    }

    // ─── MODOS ───────────────────────────────────────────────────────
    function entrarModoNormal() {
      modoActual = "normal";
      detenerRadioTotal();
      video.muted = true;
      video.play().catch(() => {});
      iniciarAudioFondo();
    }

    function entrarModoRadio(url) {
      modoActual = "radio";
      detenerAudioFondo();
      video.muted = true;
      detenerRadioTotal();
      radioPlayer.src = url;
      radioPlayer.muted = false;
      radioPlayer.volume = 1;
      radioPlayer.play().catch((e) => console.warn("Error al reproducir radio:", e));
    }

    // 🔇 MODO MUTEADO: el TV2 está reproduciendo un stream, así que aquí
    //    no debe sonar nada (ni audio de fondo, ni radio).
    function entrarModoMuteado() {
      modoActual = "muteado";
      detenerRadioTotal();
      detenerAudioFondo();
      video.muted = true;
      // El video del panel sigue visible
      video.play().catch(() => {});
    }

    // ─── ESCUCHAR COMANDOS ───────────────────────────────────────────
    listenControlCommands((action, payload) => {
      console.log("Panel (TV1) recibió comando:", action, payload, "| modo:", modoActual);

      if (action === CONTROL_ACTIONS.SET_RADIO) {
        entrarModoRadio(payload.url);
      }
      else if (action === CONTROL_ACTIONS.STOP_RADIO) {
        entrarModoNormal();
      }
      // ⚡ Aunque el stream se muestra en el TV2, el TV1 igual reacciona
      //    para silenciar su audio de fondo mientras el stream esté activo.
      else if (action === CONTROL_ACTIONS.SET_STREAM) {
        entrarModoMuteado();
      }
      else if (action === CONTROL_ACTIONS.STOP_STREAM) {
        // Solo restaurar audio si no había radio activa
        if (modoActual !== "radio") {
          entrarModoNormal();
        }
      }
      else if (action === CONTROL_ACTIONS.RESET_ALL) {
        entrarModoNormal();
      }
      else if (action === CONTROL_ACTIONS.RELOAD_SCREEN) {
        if (!payload || payload.target === "panel" || payload.target === "both") {
          const url = new URL(window.location.href);
          url.searchParams.set("_r", Date.now().toString());
          window.location.replace(url.toString());
        }
      }
    });

    // ─── DESBLOQUEO DE AUDIO (Smart TV / Kiosco) ─────────────────────
    const unlockerEl = document.getElementById("audio-unlocker");
    const unlockAudio = () => {
      if (unlockerEl) unlockerEl.remove();
      if (modoActual === "normal") iniciarAudioFondo();
      if (video.paused) video.play().catch(() => {});
    };

    if (unlockerEl) {
      unlockerEl.addEventListener("pointerdown", unlockAudio, { once: true });
      unlockerEl.addEventListener("click", unlockAudio, { once: true });
      unlockerEl.addEventListener("touchstart", unlockAudio, { once: true });
    }

    window.addEventListener("pointerdown", unlockAudio, { capture: true, once: true });
    window.addEventListener("click", unlockAudio, { capture: true, once: true });
    window.addEventListener("touchstart", unlockAudio, { capture: true, once: true });
    window.addEventListener("keydown", unlockAudio, { capture: true, once: true });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) return;
      if (modoActual === "normal") {
        iniciarAudioFondo();
        startVideoPanel();
      } else if (modoActual === "radio") {
        if (radioPlayer.paused && radioPlayer.src) {
          radioPlayer.play().catch(() => {});
        }
      }
      // En modo "muteado" no hacemos nada
    });

    initRoutesSlideshow(document.getElementById("rutas-slide"), { intervalMs: 7000 });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>

</html>

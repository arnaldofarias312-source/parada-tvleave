<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "izq  top-der  top-der"
        "izq  video    bot-der";
      width: 100vw;
      height: 100vh;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #666;
      font-size: 2vw;
      letter-spacing: 0.05em;
    }

    .cell-izq {
      grid-area: izq;
      padding: 0;
      margin: 0;
      border: none;
    }

    .cell-top-der {
      grid-area: top-der;
      border: 1px solid #222;
    }

    .cell-slide {
      grid-area: video;
      padding: 0;
      margin: 0;
      border: none;
    }

    .cell-video {
      grid-area: bot-der;
      padding: 0;
      margin: 0;
      border: none;
      background: #000;
      transform: translateZ(0);
      will-change: transform;
    }

    .cell-izq iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transform: translateZ(0);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: translateZ(0);
      will-change: transform;
    }
  </style>
</head>

<body>
  <div class="grid">
    <div class="cell cell-izq">
      <iframe src="https://mapahospital-ida.vercel.app/" title="BusTrack Realtime" allowfullscreen></iframe>
    </div>
    <div class="cell cell-top-der">En proceso</div>
    <div class="cell cell-slide">
      <div id="rutas-slide" style="width: 100%; height: 100%;"></div>
    </div>
    <div class="cell cell-video">
      <video id="ad" preload="auto" muted autoplay loop playsinline></video>
    </div>
  </div>

  <script type="module">
    import { VIDEO_URL } from "../shared/config.js";
    import { initRoutesSlideshow } from "../shared/routes-slideshow.js";

    const video = document.getElementById("ad");
    video.src = VIDEO_URL;
    video.style.objectFit = "cover";

    // Reproducción nativa en bucle sin pausas ni saltos de sincronización
    const startPlayback = () => {
      if (video.paused) {
        video.play().catch(() => {});
      }
    };
    startPlayback();
    video.addEventListener("canplay", startPlayback);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) startPlayback();
    });

    initRoutesSlideshow(document.getElementById("rutas-slide"), { intervalMs: 7000 });
  </script>

  <!-- Registro del Service Worker para funcionamiento offline -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
  </script>
</body>

</html>

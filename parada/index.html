<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parada - Panel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1.5fr 1.5fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "izq  top-der  top-der"
        "izq  video    bot-der";
      width: 100vw;
      height: 100vh;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #222;
      overflow: hidden;
      color: #666;
      font-size: 2vw;
      letter-spacing: 0.05em;
    }

    .cell-izq {
      grid-area: izq;
      padding: 0;
    }

    .cell-top-der {
      grid-area: top-der;
    }

    .cell-slide {
      grid-area: video;
    }

    .cell-video {
      grid-area: bot-der;
    }

    .cell-izq iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>

<body>
  <div class="grid">
    <div class="cell cell-izq">
      <iframe src="https://mapa-chi-ashy.vercel.app/" title="BusTrack Realtime" allowfullscreen></iframe>
    </div>
    <div class="cell cell-top-der">En proceso</div>
    <div class="cell cell-slide">
      <div id="rutas-slide" style="width: 100%; height: 100%;"></div>
    </div>
    <div class="cell cell-video">
      <video id="ad" preload="auto" muted autoplay loop playsinline></video>
    </div>
  </div>

  <script type="module">
    import { VIDEO_URL, T0 } from "../shared/config.js";
    import { initSync } from "../shared/sync.js";
    import { initRoutesSlideshow } from "../shared/routes-slideshow.js";

    const video = document.getElementById("ad");
    video.src = VIDEO_URL;

    // Vertical (grabado con teléfono) → barras negras a los lados.
    // Horizontal → llena todo el cuadrante.
    video.addEventListener("loadedmetadata", () => {
      const portrait = video.videoHeight > video.videoWidth;
      video.style.objectFit = portrait ? "contain" : "cover";
    });

    initSync(video, T0);

    initRoutesSlideshow(document.getElementById("rutas-slide"), { intervalMs: 7000 });
  </script>
</body>

</html>
